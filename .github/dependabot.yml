version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automated"
    groups:
      minor-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/tools/token-server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automated"
    groups:
      minor-updates:
        update-types:
          - "minor"
          - "patch"
