# Detekt configuration — Mute Point
# https://detekt.dev/configurations.html

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 4

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  MagicNumber:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9]*"

comments:
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
